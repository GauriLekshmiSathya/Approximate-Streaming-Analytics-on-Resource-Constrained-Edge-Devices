[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamapprox"
version = "0.1.0"
description = "Baseline Online Adaptive Stratified Reservoir Sampling (OASRS) for Stream Analytics"
authors = [
    { name = "StreamApprox Team" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
